<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NeuroDrive</title>
  <meta name="description" content="Sinir ağı ve genetik algoritma ile kendi kendine sürmeyi öğrenen arabalar.">
  <link rel="stylesheet" href="css/style.css">
  <!-- Three.js is pinned to a fixed version; only src/ui/three/ imports it, lazily. -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="src/ui/main.js"></script>
</head>
<body>
  <header class="topbar">
    <h1 class="brand">NeuroDrive</h1>
    <div class="topbar-controls">
      <label class="camera-picker" id="camera-picker" hidden>
        <span class="visually-hidden" data-i18n="camera.label"></span>
        <select id="camera-select" class="select select-compact">
          <option value="chase" data-i18n="camera.chase"></option>
          <option value="top" data-i18n="camera.top"></option>
          <option value="orbit" data-i18n="camera.orbit"></option>
        </select>
      </label>
      <div class="view-switch" role="group" data-i18n-aria="view.label">
        <button type="button" class="view-btn is-active" data-view="2d" aria-pressed="true">2D</button>
        <button type="button" class="view-btn" data-view="3d" aria-pressed="false">3D</button>
      </div>
      <div class="view-switch" role="group" data-i18n-aria="lang.label">
        <button type="button" class="view-btn lang-btn" data-lang="tr" aria-pressed="false" lang="tr">TR</button>
        <button type="button" class="view-btn lang-btn" data-lang="en" aria-pressed="false" lang="en">EN</button>
      </div>
    </div>
  </header>
  <p class="notice" id="view-notice" role="status" hidden></p>

  <main class="layout">
    <section class="stage" data-i18n-aria="stage.label">
      <div class="viewport" id="viewport-2d">
        <canvas id="canvas-2d"></canvas>
      </div>
      <div class="viewport" id="viewport-3d" hidden></div>
      <div class="race-hud" id="race-hud" hidden>
        <div class="race-bar">
          <span class="race-chip race-chip-player" id="race-lap"></span>
          <span class="race-chip race-time" id="race-time"></span>
          <span class="race-chip race-chip-ai" id="race-ai"></span>
          <button type="button" class="btn race-exit" id="btn-race-exit" data-i18n="race.exit"></button>
        </div>
        <p class="race-countdown" id="race-countdown" aria-live="assertive" hidden></p>
        <div class="race-result" id="race-result" role="dialog" aria-labelledby="race-winner" hidden>
          <h2 id="race-winner"></h2>
          <dl class="stats" id="race-summary"></dl>
          <div class="button-row">
            <button type="button" class="btn btn-primary" id="btn-race-again" data-i18n="race.again"></button>
            <button type="button" class="btn" id="btn-race-close" data-i18n="race.exit"></button>
          </div>
        </div>
        <div class="race-touch" id="race-touch">
          <div class="race-touch-group">
            <button type="button" class="race-touch-btn" data-action="left" data-i18n-aria="race.touch.left">◀</button>
            <button type="button" class="race-touch-btn" data-action="right" data-i18n-aria="race.touch.right">▶</button>
          </div>
          <div class="race-touch-group">
            <button type="button" class="race-touch-btn" data-action="brake" data-i18n-aria="race.touch.brake">▼</button>
            <button type="button" class="race-touch-btn" data-action="gas" data-i18n-aria="race.touch.gas">▲</button>
          </div>
        </div>
      </div>
    </section>

    <aside class="panel" data-i18n-aria="panel.label">
      <section class="panel-section">
        <h2 data-i18n="status.heading"></h2>
        <dl class="stats">
          <dt data-i18n="status.generation"></dt>
          <dd id="stat-generation">–</dd>
          <dt data-i18n="status.alive"></dt>
          <dd id="stat-alive">–</dd>
          <dt data-i18n="status.finished"></dt>
          <dd id="stat-finished">–</dd>
          <dt data-i18n="status.best"></dt>
          <dd id="stat-best">–</dd>
          <dt data-i18n="status.bestLap"></dt>
          <dd id="stat-lap">–</dd>
          <dt data-i18n="status.last"></dt>
          <dd id="stat-last">–</dd>
        </dl>
      </section>

      <section class="panel-section">
        <h2 data-i18n="controls.heading"></h2>
        <div class="button-row">
          <button type="button" id="btn-play" class="btn btn-primary" aria-pressed="true"></button>
          <button type="button" id="btn-next" class="btn" data-i18n="controls.next"></button>
          <button type="button" id="btn-reset" class="btn" data-i18n="controls.reset"></button>
        </div>
        <div class="field">
          <span data-i18n="controls.speed"></span>
          <div id="speed-buttons" class="seg" role="group" data-i18n-aria="controls.speed"></div>
        </div>
        <p class="muted hint" data-i18n="controls.help"></p>
      </section>

      <section class="panel-section">
        <h2 data-i18n="race.heading"></h2>
        <label class="field">
          <span data-i18n="race.car"></span>
          <select id="race-car" class="select"></select>
        </label>
        <label class="field">
          <span data-i18n="race.opponent"></span>
          <select id="race-opponent" class="select">
            <option value="pretrained" data-i18n="race.opponent.pretrained"></option>
            <option value="champion" id="race-opponent-champion" data-i18n="race.opponent.champion" disabled></option>
          </select>
        </label>
        <div class="button-row">
          <button type="button" id="btn-race" class="btn btn-primary" data-i18n="race.start"></button>
        </div>
        <p id="race-best" class="muted hint"></p>
        <p class="muted hint" data-i18n="race.help"></p>
      </section>

      <section class="panel-section">
        <h2 data-i18n="network.heading"></h2>
        <canvas id="network-canvas" class="network-canvas" role="img" data-i18n-aria="network.label"></canvas>
        <div id="network-detail" class="network-detail" aria-live="polite"></div>
        <p class="muted hint" data-i18n="network.legend"></p>
      </section>

      <section class="panel-section">
        <h2 data-i18n="chart.heading"></h2>
        <ul class="legend">
          <li><span class="swatch swatch-best"></span><span data-i18n="chart.best"></span></li>
          <li><span class="swatch swatch-avg"></span><span data-i18n="chart.avg"></span></li>
        </ul>
        <div class="chart">
          <canvas id="chart-canvas" class="chart-canvas" role="img" data-i18n-aria="chart.label"></canvas>
          <div id="chart-tooltip" class="chart-tip" hidden></div>
          <p id="chart-empty" class="chart-empty muted" data-i18n="chart.empty"></p>
        </div>
      </section>

      <section class="panel-section">
        <h2 data-i18n="findings.heading"></h2>
        <ul class="findings">
          <li data-i18n="findings.variety"></li>
          <li data-i18n="findings.corners"></li>
          <li data-i18n="findings.inputs"></li>
          <li data-i18n="findings.tuning"></li>
        </ul>
        <a id="findings-link" class="findings-link" target="_blank" rel="noopener" data-i18n="findings.link"></a>
      </section>

      <section class="panel-section">
        <h2 data-i18n="display.heading"></h2>
        <label class="field">
          <span data-i18n="display.crowd"></span>
          <select id="crowd-select" class="select">
            <option value="all" data-i18n="display.crowd.all"></option>
            <option value="top10" data-i18n="display.crowd.top10"></option>
            <option value="dim" data-i18n="display.crowd.dim"></option>
          </select>
        </label>
        <label class="check">
          <input type="checkbox" id="sensors-toggle" checked>
          <span data-i18n="display.sensors"></span>
        </label>
      </section>

      <section class="panel-section">
        <h2><label for="track-select" data-i18n="track.heading"></label></h2>
        <select id="track-select" class="select">
          <option value="oval" data-i18n="track.oval"></option>
          <option value="classic" data-i18n="track.classic"></option>
          <option value="technical" data-i18n="track.technical"></option>
          <option value="custom" id="track-custom-option" data-i18n="track.custom" hidden></option>
        </select>
        <div class="button-row track-actions">
          <button type="button" id="btn-draw-track" class="btn" data-i18n="editor.draw"></button>
        </div>
        <p class="muted hint" data-i18n="editor.help"></p>
      </section>

      <section class="panel-section">
        <h2 data-i18n="brain.heading"></h2>
        <div class="button-row">
          <button type="button" id="btn-load-pretrained" class="btn btn-primary" data-i18n="brain.loadPretrained"></button>
        </div>
        <div class="button-row">
          <button type="button" id="btn-save-brain" class="btn" data-i18n="brain.save" disabled></button>
          <button type="button" id="btn-load-saved" class="btn" data-i18n="brain.loadSaved" disabled></button>
        </div>
        <div class="button-row">
          <button type="button" id="btn-download-brain" class="btn" data-i18n="brain.download" disabled></button>
          <label class="btn file-btn">
            <span data-i18n="brain.upload"></span>
            <input type="file" id="brain-file" accept=".json,application/json" class="visually-hidden">
          </label>
        </div>
        <p id="brain-status" class="muted hint" role="status" hidden></p>
        <p class="muted hint" data-i18n="brain.hint"></p>
      </section>

      <section class="panel-section">
        <h2 data-i18n="settings.heading"></h2>
        <div id="settings-fields"></div>
        <label class="check">
          <input type="checkbox" id="shadows-toggle" checked>
          <span data-i18n="settings.shadows"></span>
        </label>
        <div class="button-row settings-actions">
          <button type="button" id="btn-apply-settings" class="btn btn-primary" data-i18n="settings.apply"></button>
        </div>
        <p id="settings-pending" class="pending" data-i18n="settings.pending" hidden></p>
        <p class="muted hint" data-i18n="settings.hint"></p>
      </section>
    </aside>
  </main>
</body>
</html>
