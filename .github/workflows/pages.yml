name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          package-manager-cache: false # no dependencies, nothing to cache
          node-version: 24
      - run: npm test
      # Static site: only what the browser needs.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html css src _site/
          if [ -d assets ]; then cp -r assets _site/; fi
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
