name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          package-manager-cache: false # no dependencies, nothing to cache
          node-version: ${{ matrix.node-version }}
      - run: npm test
